appId: com.zenthoz.pos
productName: "POS System"
copyright: "Copyright 2024 Zenthoz Technologies"

directories:
  output: dist
  buildResources: build

files:
  - "electron/**/*"
  - "!node_modules/**/*"

extraResources:
  - from: ".next/standalone"
    to: "app/.next/standalone"
    filter: ["**/*"]
  - from: ".next/static"
    to: "app/.next/standalone/.next/static"
    filter: ["**/*"]
  - from: "public"
    to: "app/.next/standalone/public"
    filter: ["**/*"]
  - from: "prisma"
    to: "app/prisma"
    filter: ["schema.prisma"]

win:
  target:
    - target: nsis
      arch: [x64]
  icon: "build/icon.ico"
  requestedExecutionLevel: requireAdministrator

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "POS System"
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
  installerHeaderIcon: "build/icon.ico"

publish: null
