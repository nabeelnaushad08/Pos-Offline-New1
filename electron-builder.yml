appId: com.zenthoz.pos
productName: "POS System"
copyright: "Copyright 2024 Zenthoz Technologies"

directories:
  output: dist
  buildResources: build

files:
  - "electron/**/*"
  - "!node_modules/**/*"

extraResources:
  - from: ".next/standalone"
    to: "app/.next/standalone"
    filter: ["**/*"]
  - from: ".next/static"
    to: "app/.next/standalone/.next/static"
    filter: ["**/*"]

win:
  target:
    - target: nsis
      arch: [x64]
  requestedExecutionLevel: requireAdministrator

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "POS System"

publish: null
