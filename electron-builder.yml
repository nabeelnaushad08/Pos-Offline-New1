appId: com.zenthoz.pos
productName: "POS System"
copyright: "Copyright 2024 Zenthoz Technologies"

directories:
  output: dist
  buildResources: build

files:
  - "electron/**/*"
  - "!node_modules/**/*"

extraResources:
  - from: ".next/standalone"
    to: "app/.next/standalone"
    filter: ["**/*"]
  - from: ".next/static"
    to: "app/.next/standalone/.next/static"
    filter: ["**/*"]
  - from: "public"
    to: "app/public"
    filter: ["**/*"]

win:
  target:
    - target: nsis
      arch: [x64]
  icon: "build/icon.ico"
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "POS System"
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
  installerHeaderIcon: "build/icon.ico"

mac:
  target: dmg
  icon: "build/icon.icns"
  category: public.app-category.business

linux:
  target: AppImage
  icon: "build/icon.png"
  category: Office

publish: null
